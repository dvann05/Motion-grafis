name: Build Motion Lab AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".env.example"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: motion-lab-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Mengambil source code repository
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Menyiapkan Java 17
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 3. Menyiapkan Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true

      # 4. Memasang SDK yang dibutuhkan project
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

          echo "Installed Android SDK packages:"
          sdkmanager --list_installed

      # 5. Memasang Gradle sesuai versi project
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-read-only: false

      # 6. Membuat debug signing key
      - name: Create debug signing key
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -s debug.keystore

      # 7. Memeriksa lingkungan build
      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version

          test -d "$ANDROID_HOME/platforms/android-36.1"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      # 8. Menjalankan unit test dan membangun APK
      - name: Run unit tests and build debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --no-configuration-cache --stacktrace \
            clean testDebugUnitTest assembleDebug

      # 9. Memeriksa dan memverifikasi APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

          mkdir -p artifacts

          cp "$APK" artifacts/Motion-Lab-AI-debug.apk

          sha256sum artifacts/Motion-Lab-AI-debug.apk

          ls -lh artifacts/Motion-Lab-AI-debug.apk

      # 10. Mengunggah APK agar bisa diunduh
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Motion-Lab-AI-debug-APK
          path: artifacts/Motion-Lab-AI-debug.apk
          if-no-files-found: error
          retention-days: 14
